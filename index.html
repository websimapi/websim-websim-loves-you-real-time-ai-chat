<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Loves You - Real-time AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .chat-container {
            width: 90vw;
            max-width: 800px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .chat-title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .chat-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .message-author {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .message-content {
            line-height: 1.5;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            color: #666;
            font-style: italic;
            animation: pulse 1.5s ease-in-out infinite; /* Re-using pulse animation for typing */
        }

        .online-users {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 95vw;
                height: 90vh;
                border-radius: 15px;
            }
            
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1 class="chat-title">💝 WebSim Loves You</h1>
            <p class="chat-subtitle" id="chatSubtitle">See WebSim AI respond to messages in real-time!</p>
        </div>
        
        <div class="online-users" id="onlineUsers">
            <span>👥 Loading...</span>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <div class="message ai">
                <div class="message-author">WebSim AI 🤖</div>
                <div class="message-content" id="initialMessage">Hello! I'm WebSim AI. Messages will appear here as they come in, and I'll respond in real-time! ✨</div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            WebSim AI is thinking... 🤔
        </div>
        
        <!-- Input container removed -->
    </div>

    <script>
        // WebSocket room for real-time multiplayer chat
        const room = new WebsimSocket();
        let currentUser = null;

        // DOM elements
        const messagesContainer = document.getElementById('messagesContainer');
        const typingIndicator = document.getElementById('typingIndicator');
        const onlineUsers = document.getElementById('onlineUsers');
        const chatSubtitle = document.getElementById('chatSubtitle');
        const initialMessageContent = document.getElementById('initialMessage');

        // Initialize the chat room
        async function initializeChat() {
            await room.initialize();
            
            // Get current user info
            currentUser = room.peers[room.clientId];
            updateOnlineUsers();

            // Subscribe to presence changes (users joining/leaving)
            room.subscribePresence((presence) => {
                updateOnlineUsers();
            });

            // Subscribe to room state changes (new messages)
            room.subscribeRoomState((roomState) => {
                if (roomState.messages) {
                    updateMessages(roomState.messages);
                }
            });

            // Listen for AI responses and other events
            room.onmessage = (event) => {
                const data = event.data;
                switch (data.type) {
                    case "ai_response":
                        addAIMessage(data.content, data.messageId);
                        hideTyping();
                        break;
                    case "user_typing": // This client won't send these, but can still display if others do
                        if (data.clientId !== room.clientId && data.isTyping) {
                            showTyping(data.username);
                        } else if (data.clientId !== room.clientId && !data.isTyping) {
                            hideTyping(); // Hide if other user stopped typing
                        }
                        break;
                    case "connected":
                        addSystemMessage(`${data.username} joined the chat! 👋`);
                        break;
                    case "disconnected":
                        addSystemMessage(`${data.username} left the chat 👋`);
                        break;
                }
            };
            
            // Update initial texts if needed based on a more dynamic setup in future
            // chatSubtitle.textContent = "See WebSim AI respond to messages in real-time!";
            // initialMessageContent.textContent = "Hello! I'm WebSim AI. Messages will appear here as they come in, and I'll respond in real-time! ✨";
        }

        // Update online users display
        function updateOnlineUsers() {
            const userCount = Object.keys(room.peers).length;
            const userAvatars = Object.values(room.peers)
                .slice(0, 5) // Show max 5 avatars
                .map(peer => `<img src="${peer.avatarUrl}" alt="${peer.username}" class="user-avatar">`)
                .join('');
            
            onlineUsers.innerHTML = `👥 ${userCount} online ${userAvatars}`;
        }

        // Update messages from room state
        function updateMessages(messages) {
            Object.keys(messages).forEach(messageId => {
                const message = messages[messageId];
                if (!document.querySelector(`[data-message-id="${messageId}"]`)) {
                    if (message.type === 'user') {
                        addUserMessage(message.content, message.author, message.authorAvatar, messageId);
                        
                        // Trigger AI response for new user messages
                        if (message.needsResponse) {
                            // Ensure this client hasn't already started processing this messageId
                            // This is a simple check; a more robust lock would involve roomState
                            if (!window[`processing_${messageId}`]) {
                                window[`processing_${messageId}`] = true;
                                processMessageWithAI(message.content, messageId).finally(() => {
                                    delete window[`processing_${messageId}`];
                                });
                            }
                        }
                    }
                } else {
                    // If message exists, check if its 'needsResponse' status changed in roomState
                    // and if AI processing might need to be re-evaluated or cancelled
                    // For now, simply ensures AI isn't re-triggered if already processed.
                    const existingMessageData = messages[messageId];
                    if (existingMessageData && typeof existingMessageData.needsResponse === 'boolean' && !existingMessageData.needsResponse) {
                         // If a message is marked as not needing response, cancel any ongoing processing for it.
                         // This is a simplified approach. True cancellation of async LLM calls isn't trivial.
                         if (window[`processing_${messageId}`]) {
                             // console.log(`AI response for ${messageId} no longer needed or handled by another client.`);
                             // Deleting the flag might prevent this client from sending its own response if another client was faster.
                             delete window[`processing_${messageId}`];
                         }
                    }
                }
            });
        }

        // Process message with AI
        async function processMessageWithAI(userMessage, messageId) {
            // Only proceed if this client is still "assigned" to process this.
            if (!window[`processing_${messageId}`]) return;

            showTyping("WebSim AI");

            try {
                // Generate AI response using websim's LLM
                const response = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: `You are WebSim AI, a friendly, enthusiastic, and slightly playful AI assistant. You love talking to users and are excited to chat! Keep responses conversational, warm, and engaging. Use emojis occasionally but not excessively. You're part of a real-time chat experience where users can talk to you instantly.`
                        },
                        {
                            role: "user",
                            content: userMessage
                        }
                    ]
                });

                // Check again if processing is still valid before sending (another client might have responded)
                // This relies on the `ai_response` event leading to `needsResponse: false` update quickly.
                const currentMessageState = room.roomState.messages && room.roomState.messages[messageId];
                if (currentMessageState && !currentMessageState.needsResponse) {
                    // console.log(`AI response for ${messageId} already handled or outdated. Skipping send.`);
                    hideTyping();
                    delete window[`processing_${messageId}`];
                    return;
                }
                
                // Broadcast AI response
                room.send({
                    type: "ai_response",
                    content: response.content,
                    messageId: messageId, // Correlate AI response to the user message ID
                    timestamp: Date.now()
                });

                // Mark message as processed by updating roomState
                // This should be the primary way other clients know not to process it.
                room.updateRoomState({
                    messages: {
                        [messageId]: {
                            // type, content, author, etc. are merged by updateRoomState
                            needsResponse: false 
                        }
                    }
                });

            } catch (error) {
                console.error('Error getting AI response:', error);
                // Only send error if this client was supposed to respond and hasn't been superseded.
                const currentMessageState = room.roomState.messages && room.roomState.messages[messageId];
                 if (currentMessageState && currentMessageState.needsResponse && window[`processing_${messageId}`]) {
                    room.send({
                        type: "ai_response",
                        content: "Sorry, I'm having trouble responding right now. Please try again! 😅",
                        messageId: messageId,
                        timestamp: Date.now()
                    });
                     room.updateRoomState({
                        messages: {
                            [messageId]: { needsResponse: false }
                        }
                    });
                }
            } finally {
                // Regardless of outcome, if this client initiated, it should hide typing for itself
                // unless another typing event (e.g. user_typing from another user) is active
                 if (typingIndicator.textContent.startsWith("WebSim AI")) {
                    hideTyping();
                 }
                delete window[`processing_${messageId}`];
            }
        }

        // Add user message to chat
        function addUserMessage(content, author, avatarUrl, messageId) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.setAttribute('data-message-id', messageId);
            messageDiv.innerHTML = `
                <div class="message-author">${author} 👤</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add AI message to chat
        function addAIMessage(content, originalMessageId) {
            // Ensure we don't add duplicate AI responses for the same original message
            if (document.querySelector(`[data-ai-for-message-id="${originalMessageId}"]`)) {
                return;
            }
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.setAttribute('data-ai-for-message-id', originalMessageId); // Link AI message to original user message
            messageDiv.innerHTML = `
                <div class="message-author">WebSim AI 🤖</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add system message
        function addSystemMessage(content) {
            const messageDiv = document.createElement('div');
            // System messages don't need a data-message-id as they are not in roomState.messages
            messageDiv.className = 'message system ai'; // Styled like AI for consistency
            messageDiv.innerHTML = `
                <div class="message-content" style="font-style: italic; opacity: 0.8;">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Show typing indicator
        function showTyping(username) {
            typingIndicator.textContent = `${username || 'Someone'} is thinking... 🤔`;
            typingIndicator.style.display = 'block';
            scrollToBottom();
        }

        // Hide typing indicator
        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        // Scroll to bottom of messages
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Event listeners removed as there's no input field

        // Initialize the chat when page loads
        initializeChat().catch(console.error);

        // No need to focus input on load anymore
    </script>

</body>
</html>
