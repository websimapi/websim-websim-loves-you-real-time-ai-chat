<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Loves You - Real-time AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .chat-container {
            width: 90vw;
            max-width: 800px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .chat-title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .chat-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        
        .polling-status {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 8px;
            transition: opacity 0.3s ease-in-out;
            min-height: 1em; /* Reserve space to prevent layout shift */
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .message-author {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .message-content {
            line-height: 1.5;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            color: #666;
            font-style: italic;
            animation: pulse 1.5s ease-in-out infinite; /* Re-using pulse animation for typing */
        }

        .online-users {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 95vw;
                height: 90vh;
                border-radius: 15px;
            }
            
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1 class="chat-title">💝 WebSim Loves You</h1>
            <p class="chat-subtitle" id="chatSubtitle">See WebSim AI respond to messages in real-time!</p>
            <p class="polling-status" id="pollingStatus">Initializing comment sync...</p>
        </div>
        
        <div class="online-users" id="onlineUsers">
            <span>👥 Loading...</span>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            <div class="message ai">
                <div class="message-author">WebSim AI 🤖</div>
                <div class="message-content" id="initialMessage">Hello! I'm WebSim AI. Messages will appear here as they come in, and I'll respond in real-time! ✨</div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            WebSim AI is thinking... 🤔
        </div>
        
    </div>

    <script>
        // WebSocket room for real-time multiplayer chat
        const room = new WebsimSocket();
        let currentUser = null;

        // DOM elements
        const messagesContainer = document.getElementById('messagesContainer');
        const typingIndicator = document.getElementById('typingIndicator');
        const onlineUsers = document.getElementById('onlineUsers');
        const chatSubtitle = document.getElementById('chatSubtitle');
        const initialMessageContent = document.getElementById('initialMessage');
        const pollingStatusElement = document.getElementById('pollingStatus');

        // Polling configuration
        let currentProjectDetails = null;
        const processedCommentIds = new Set();
        const POLLING_INTERVAL = 7000; // 7 seconds
        let pollingIntervalId = null;

        // Helper to extract text from DocumentNode (simplified)
        function extractTextFromDocumentNode(docNode) {
            if (!docNode || !docNode.children || docNode.children.length === 0) {
                return "";
            }
            let text = "";
            for (const block of docNode.children) {
                if (block.type === "paragraph" && block.children) {
                    for (const inline of block.children) {
                        if (inline.type === "text") {
                            text += inline.text + " ";
                        } else if (inline.type === "link" && inline.children) { // Basic link text extraction
                             for (const linkChild of inline.children) {
                                if (linkChild.type === "text") {
                                    text += linkChild.text + " ";
                                }
                            }
                        }
                        // Can be extended for other inline types like user mentions, etc.
                    }
                }
                 // Can be extended for other block types like lists, etc.
            }
            return text.trim();
        }

        // Poll for new comments from project metadata
        async function pollForComments() {
            if (!currentProjectDetails || !currentProjectDetails.id) {
                pollingStatusElement.textContent = "Project info unavailable. Cannot sync comments.";
                console.warn("Project ID not available for polling.");
                return;
            }

            pollingStatusElement.textContent = "Checking for new comments... 💬";
            pollingStatusElement.style.opacity = '1';

            try {
                const response = await fetch(`/api/v1/projects/${currentProjectDetails.id}/comments?sort_by=created_at&sort_order=desc&first=20`); // Fetch more to catch up if needed
                if (!response.ok) {
                    throw new Error(`Failed to fetch comments: ${response.statusText} (status: ${response.status})`);
                }
                const data = await response.json();
                
                const newCommentsFound = [];

                if (data.comments && data.comments.data) {
                    // API returns newest first, so process in reverse to add to chat in chronological order
                    for (let i = data.comments.data.length - 1; i >= 0; i--) {
                        const commentItem = data.comments.data[i];
                        const comment = commentItem.comment;
                        // Check if comment is truly new and not already in roomState or processed by this client
                        if (!processedCommentIds.has(comment.id) && (!room.roomState.messages || !room.roomState.messages[comment.id])) {
                             newCommentsFound.push(comment);
                        } else if (!processedCommentIds.has(comment.id) && room.roomState.messages && room.roomState.messages[comment.id] && room.roomState.messages[comment.id].needsResponse !== false) {
                            // Comment exists in room state but might not have been fully processed by this client from poll (e.g. needsResponse is still true/undefined)
                            // Or if it's in room state, but this client hasn't added to its processedCommentIds from polling yet.
                            // This path is less likely if the first condition is robust.
                            // For safety, add to newCommentsFound to ensure it's considered.
                            newCommentsFound.push(comment);
                        } else if (!processedCommentIds.has(comment.id)){
                            // It's in roomState and possibly handled, but this client's poll didn't know. Mark as processed.
                            processedCommentIds.add(comment.id);
                        }
                    }
                }
                
                if (newCommentsFound.length > 0) {
                    addSystemMessage(`${newCommentsFound.length} new comment(s) found from metadata! Processing...`);
                }

                for (const comment of newCommentsFound) {
                    const messageId = comment.id;

                    // Double check against current room state before updating
                    const existingMessageInRoomState = room.roomState.messages && room.roomState.messages[messageId];
                    if (existingMessageInRoomState && typeof existingMessageInRoomState.needsResponse === 'boolean' && !existingMessageInRoomState.needsResponse) {
                        processedCommentIds.add(messageId); // Ensure it's marked processed locally
                        continue; 
                    }
                    
                    processedCommentIds.add(messageId); // Add to processed set

                    const authorUsername = (comment.author && comment.author.username) ? comment.author.username : 'Unknown User';
                    const authorAvatar = (comment.author && comment.author.username) ? `https://images.websim.com/avatar/${comment.author.username}` : '';
                    let content = comment.raw_content || extractTextFromDocumentNode(comment.content);
                    if (!content || content.trim() === "") {
                        content = "[empty comment]";
                    }

                    room.updateRoomState({
                        messages: {
                            [messageId]: {
                                type: 'user',
                                content: content,
                                author: authorUsername,
                                authorAvatar: authorAvatar, 
                                timestamp: new Date(comment.created_at).getTime(),
                                needsResponse: true, 
                                id: messageId 
                            }
                        }
                    });
                }
                const now = new Date();
                pollingStatusElement.textContent = `Comments synced. Last check: ${now.toLocaleTimeString()}`;

            } catch (error) {
                console.error("Error polling for comments:", error);
                pollingStatusElement.textContent = "Error syncing comments. Will retry.";
            } finally {
                 setTimeout(() => { 
                     if (pollingStatusElement.textContent.startsWith("Comments synced") || pollingStatusElement.textContent.startsWith("Error syncing")) {
                        pollingStatusElement.style.opacity = '0.7'; 
                     }
                }, 3000);
            }
        }

        // Initialize the chat room
        async function initializeChat() {
            try {
                await room.initialize();
            } catch (e) {
                console.error("Failed to initialize WebsimSocket room:", e);
                pollingStatusElement.textContent = "Chat connection error.";
                addSystemMessage("Could not connect to the chat service. Real-time features will be limited.");
                // Optionally, you might want to stop further initialization or polling here
                // For now, we'll let it try to fetch project info, though polling might fail or be less useful.
            }
            
            currentUser = room.peers[room.clientId];
            updateOnlineUsers();

            room.subscribePresence((presence) => {
                updateOnlineUsers();
            });

            room.subscribeRoomState((roomState) => {
                if (roomState.messages) {
                    updateMessages(roomState.messages);
                }
            });

            room.onmessage = (event) => {
                const data = event.data;
                switch (data.type) {
                    case "ai_response":
                        addAIMessage(data.content, data.messageId);
                        hideTyping();
                        // If this AI response corresponds to a message from polling, ensure it's marked.
                        // The current logic marks needsResponse: false in processMessageWithAI.
                        if (data.messageId && processedCommentIds.has(data.messageId)) {
                           // Optionally update polling status or local state if needed.
                        }
                        break;
                    case "user_typing": 
                        if (data.clientId !== room.clientId && data.isTyping) {
                            showTyping(data.username);
                        } else if (data.clientId !== room.clientId && !data.isTyping) {
                            hideTyping();
                        }
                        break;
                    case "connected":
                        addSystemMessage(`${data.username} joined the chat! 👋`);
                        break;
                    case "disconnected":
                        addSystemMessage(`${data.username} left the chat 👋`);
                        break;
                }
            };
            
            // Fetch current project details for polling
            try {
                const project = await window.websim.getCurrentProject();
                currentProjectDetails = project;
                if (!currentProjectDetails || !currentProjectDetails.id) {
                    console.error("Could not get current project information. Comment polling will not work.");
                    pollingStatusElement.textContent = "Error: Project info missing.";
                } else {
                    pollingStatusElement.textContent = `Syncing comments for "${currentProjectDetails.title || 'this project'}"...`;
                    // Initial load of existing messages in roomState to populate processedCommentIds
                    // This helps avoid reprocessing if messages were loaded into roomState before polling starts
                    if (room.roomState && room.roomState.messages) {
                        Object.keys(room.roomState.messages).forEach(msgId => {
                             // Also add to processedCommentIds if it's a user message that didn't need response
                            // (implying it was already handled or is an AI message).
                            // We are primarily interested in user messages for polling.
                            const message = room.roomState.messages[msgId];
                            if (message.type === 'user' || message.id) { // message.id for any comment from API
                                processedCommentIds.add(msgId);
                            }
                        });
                    }
                    await pollForComments(); // Initial poll
                    if (pollingIntervalId) clearInterval(pollingIntervalId); // Clear previous interval if any
                    pollingIntervalId = setInterval(pollForComments, POLLING_INTERVAL);
                }
            } catch (err) {
                 console.error("Failed to get current project info:", err);
                 pollingStatusElement.textContent = "Error loading project data for comment sync.";
            }
        }

        // Update online users display
        function updateOnlineUsers() {
            if (!room.peers) return; // Guard against undefined peers
            const userCount = Object.keys(room.peers).length;
            const userAvatars = Object.values(room.peers)
                .slice(0, 5) 
                .map(peer => peer.avatarUrl ? `<img src="${peer.avatarUrl}" alt="${peer.username || 'User'}" class="user-avatar">` : '')
                .join('');
            
            onlineUsers.innerHTML = `👥 ${userCount} online ${userAvatars}`;
        }

        // Update messages from room state
        function updateMessages(messages) {
            Object.keys(messages).forEach(messageId => {
                const message = messages[messageId];
                if (!document.querySelector(`[data-message-id="${messageId}"]`)) {
                    if (message.type === 'user') {
                        // message.authorAvatar is now part of the message object in roomState from polling
                        addUserMessage(message.content, message.author, message.authorAvatar, messageId);
                        
                        if (message.needsResponse) {
                            if (!window[`processing_${messageId}`]) {
                                window[`processing_${messageId}`] = true;
                                processMessageWithAI(message.content, messageId).finally(() => {
                                    delete window[`processing_${messageId}`];
                                });
                            }
                        }
                    }
                    // Note: AI messages are added by addAIMessage directly, not through this block
                } else {
                    const existingMessageData = messages[messageId];
                    if (existingMessageData && typeof existingMessageData.needsResponse === 'boolean' && !existingMessageData.needsResponse) {
                         if (window[`processing_${messageId}`]) {
                             delete window[`processing_${messageId}`];
                         }
                    }
                }
            });
        }

        // Process message with AI
        async function processMessageWithAI(userMessage, messageId) {
            if (!window[`processing_${messageId}`]) return;

            showTyping("WebSim AI");

            try {
                const response = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: `You are WebSim AI, a friendly, enthusiastic, and slightly playful AI assistant. You love talking to users and are excited to chat! Keep responses conversational, warm, and engaging. Use emojis occasionally but not excessively. You're part of a real-time chat experience where users can talk to you instantly. If you see a comment that seems like a question, try to answer it. If it's a statement, react to it engagingly.`
                        },
                        {
                            role: "user",
                            content: userMessage
                        }
                    ]
                });

                const currentMessageState = room.roomState.messages && room.roomState.messages[messageId];
                if (currentMessageState && !currentMessageState.needsResponse && currentMessageState.type !== 'ai_response_placeholder') { // check for placeholder if we add one
                    hideTyping();
                    delete window[`processing_${messageId}`];
                    return;
                }
                
                room.send({
                    type: "ai_response",
                    content: response.content,
                    messageId: messageId, 
                    timestamp: Date.now()
                });

                room.updateRoomState({
                    messages: {
                        [messageId]: {
                            needsResponse: false 
                        }
                    }
                });

            } catch (error) {
                console.error('Error getting AI response:', error);
                const currentMessageState = room.roomState.messages && room.roomState.messages[messageId];
                 if (currentMessageState && currentMessageState.needsResponse && window[`processing_${messageId}`]) {
                    room.send({
                        type: "ai_response",
                        content: "Sorry, I'm having trouble responding right now. Please try again! 😅",
                        messageId: messageId,
                        timestamp: Date.now()
                    });
                     room.updateRoomState({
                        messages: {
                            [messageId]: { needsResponse: false }
                        }
                    });
                }
            } finally {
                 if (typingIndicator.textContent.startsWith("WebSim AI")) {
                    hideTyping();
                 }
                delete window[`processing_${messageId}`];
            }
        }

        // Add user message to chat
        function addUserMessage(content, author, avatarUrl, messageId) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.setAttribute('data-message-id', messageId);
            // Avatar display in message is currently not styled, so sticking to username for now.
            // If avatarUrl is provided and styling is added, it could be integrated here.
            // const avatarImg = avatarUrl ? `<img src="${avatarUrl}" class="message-avatar">` : '';
            messageDiv.innerHTML = `
                <div class="message-author">${author || 'User'} 👤</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add AI message to chat
        function addAIMessage(content, originalMessageId) {
            if (document.querySelector(`[data-ai-for-message-id="${originalMessageId}"]`)) {
                return;
            }
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.setAttribute('data-ai-for-message-id', originalMessageId); 
            messageDiv.innerHTML = `
                <div class="message-author">WebSim AI 🤖</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add system message
        function addSystemMessage(content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system ai'; 
            messageDiv.innerHTML = `
                <div class="message-content" style="font-style: italic; opacity: 0.8;">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Show typing indicator
        function showTyping(username) {
            typingIndicator.textContent = `${username || 'Someone'} is thinking... 🤔`;
            typingIndicator.style.display = 'block';
            scrollToBottom();
        }

        // Hide typing indicator
        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        // Scroll to bottom of messages
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        initializeChat().catch(err => {
            console.error("Initialization failed:", err);
            pollingStatusElement.textContent = "Critical error during setup.";
            addSystemMessage("A critical error occurred during page setup. Chat functionality might be broken.");
        });

    </script>
