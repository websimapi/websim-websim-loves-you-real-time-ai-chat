        // AI Context Documentation String

        // Helper to extract text from DocumentNode (simplified)
        function extractTextFromDocumentNode(docNode) {
            if (!docNode || !docNode.children || docNode.children.length === 0) {
                return "";
            }
            let text = "";
            for (const block of docNode.children) {
                if (block.type === "paragraph" && block.children) {
                    for (const inline of block.children) {
                        if (inline.type === "text") {
                            text += inline.text + " ";
                        } else if (inline.type === "link" && inline.children) { // Basic link text extraction
                             for (const linkChild of inline.children) {
                                if (linkChild.type === "text") {
                                    text += linkChild.text + " ";
                                }
                            }
                        }
                        // Can be extended for other inline types like user mentions, etc.
                    }
                }
                 // Can be extended for other block types like lists, etc.
            }
            return text.trim();
        }

        // Poll for new comments from project metadata
        async function pollForComments() {
            if (!currentProjectDetails || !currentProjectDetails.id) {
                pollingStatusElement.textContent = "Project info unavailable. Cannot sync comments.";
                console.warn("Project ID not available for polling.");
                return;
            }

            pollingStatusElement.textContent = "Checking for new comments... 💬";
            pollingStatusElement.style.opacity = '1';

            try {
                const response = await fetch(`/api/v1/projects/${currentProjectDetails.id}/comments?sort_by=created_at&sort_order=desc&first=20`);
                if (!response.ok) {
                    throw new Error(`Failed to fetch comments: ${response.statusText} (status: ${response.status})`);
                }
                const data = await response.json();
                
                const newCommentsFound = [];

                if (data.comments && data.comments.data) {
                    for (let i = data.comments.data.length - 1; i >= 0; i--) {
                        const commentItem = data.comments.data[i];
                        const comment = commentItem.comment;
                        
                        // Check if comment exists in database
                        const existingComments = room.collection('comment').filter({ comment_id: comment.id }).getList();
                        if (!processedCommentIds.has(comment.id) && existingComments.length === 0) {
                            newCommentsFound.push(comment);
                        } else if (!processedCommentIds.has(comment.id)) {
                            processedCommentIds.add(comment.id);
                        }
                    }
                }
                
                if (newCommentsFound.length > 0) {
                    addSystemMessage(`${newCommentsFound.length} new comment(s) found from metadata! Processing...`);
                }

                for (const comment of newCommentsFound) {
                    processedCommentIds.add(comment.id);

                    const authorUsername = (comment.author && comment.author.username) ? comment.author.username : 'Unknown User';
                    const authorAvatar = (comment.author && comment.author.username) ? `https://images.websim.com/avatar/${comment.author.username}` : '';
                    let content = comment.raw_content || extractTextFromDocumentNode(comment.content);
                    if (!content || content.trim() === "") {
                        content = "[empty comment]";
                    }

                    // Store comment in database
                    await room.collection('comment').create({
                        comment_id: comment.id,
                        content: content,
                        author: authorUsername,
                        author_avatar: authorAvatar,
                        created_at: comment.created_at,
                        needs_response: true
                    });
                }
                const now = new Date();
                pollingStatusElement.textContent = `Comments synced. Last check: ${now.toLocaleTimeString()}`;

            } catch (error) {
                console.error("Error polling for comments:", error);
                pollingStatusElement.textContent = "Error syncing comments. Will retry.";
            } finally {
                setTimeout(() => { 
                    if (pollingStatusElement.textContent.startsWith("Comments synced") || pollingStatusElement.textContent.startsWith("Error syncing")) {
                       pollingStatusElement.style.opacity = '0.7'; 
                    }
               }, 3000);
            }
        }

        // Initialize the chat room
        async function initializeChat() {
            try {
                await room.initialize();
            } catch (e) {
                console.error("Failed to initialize WebsimSocket room:", e);
                pollingStatusElement.textContent = "Chat connection error.";
                addSystemMessage("Could not connect to the chat service. Real-time features will be limited.");
            }
            
            currentUser = room.peers[room.clientId];
            updateOnlineUsers();

            room.subscribePresence((presence) => {
                updateOnlineUsers();
            });

            // Subscribe to database changes instead of room state
            room.collection('comment').subscribe(() => {
                updateMessagesFromDatabase();
            });

            room.collection('ai_response').subscribe(() => {
                updateMessagesFromDatabase();
            });

            room.onmessage = (event) => {
                const data = event.data;
                switch (data.type) {
                    case "ai_response_complete":
                        hideTyping();
                        updateMessagesFromDatabase();
                        break;
                    case "user_typing": 
                        if (data.clientId !== room.clientId && data.isTyping) {
                            showTyping(data.username);
                        } else if (data.clientId !== room.clientId && !data.isTyping) {
                            hideTyping();
                        }
                        break;
                    case "connected":
                        addSystemMessage(`${data.username} joined the chat! 👋`);
                        break;
                    case "disconnected":
                        addSystemMessage(`${data.username} left the chat 👋`);
                        break;
                }
            };
            
            // Fetch current project details for polling
            try {
                const project = await window.websim.getCurrentProject();
                currentProjectDetails = project;
                if (!currentProjectDetails || !currentProjectDetails.id) {
                    console.error("Could not get current project information. Comment polling will not work.");
                    pollingStatusElement.textContent = "Error: Project info missing.";
                } else {
                    pollingStatusElement.textContent = `Syncing comments for "${currentProjectDetails.title || 'this project'}"...`;
                    
                    // Load existing comments from database
                    const existingComments = room.collection('comment').getList();
                    existingComments.forEach(comment => {
                        processedCommentIds.add(comment.comment_id);
                    });
                    
                    updateMessagesFromDatabase(); // Initial render
                    await pollForComments();
                    if (pollingIntervalId) clearInterval(pollingIntervalId);
                    pollingIntervalId = setInterval(pollForComments, POLLING_INTERVAL);
                }
            } catch (err) {
                console.error("Failed to get current project info:", err);
                pollingStatusElement.textContent = "Error loading project data for comment sync.";
            }
        }

        // Update online users display
        function updateOnlineUsers() {
            if (!room.peers) return; // Guard against undefined peers
            const userCount = Object.keys(room.peers).length;
            const userAvatars = Object.values(room.peers)
                .slice(0, 5) 
                .map(peer => peer.avatarUrl ? `<img src="${peer.avatarUrl}" alt="${peer.username || 'User'}" class="user-avatar">` : '')
                .join('');
            
            onlineUsers.innerHTML = `👥 ${userCount} online ${userAvatars}`;
        }

        // Update messages from database (limit to 5 most recent)
        function updateMessagesFromDatabase() {
            // Clear current messages (except system messages)
            const systemMessages = Array.from(messagesContainer.querySelectorAll('.message.system'));
            messagesContainer.innerHTML = '';
            systemMessages.forEach(msg => messagesContainer.appendChild(msg));

            // Get all comments and responses from database
            const comments = room.collection('comment').getList().reverse(); // Newest first
            const aiResponses = room.collection('ai_response').getList();

            // Take only the 5 most recent comments
            const recentComments = comments.slice(0, 5);

            recentComments.forEach(comment => {
                // Add user message
                addUserMessage(comment.content, comment.author, comment.author_avatar, comment.comment_id);
                
                // Check for AI response
                const response = aiResponses.find(resp => resp.comment_id === comment.comment_id);
                if (response) {
                    addAIMessage(response.content, comment.comment_id);
                } else if (comment.needs_response) {
                    // Process with AI if needed
                    if (!window[`processing_${comment.comment_id}`]) {
                        window[`processing_${comment.comment_id}`] = true;
                        processMessageWithAI(comment.content, comment.comment_id).finally(() => {
                            delete window[`processing_${comment.comment_id}`];
                        });
                    }
                }
            });
        }

        // Add user message to chat
        function addUserMessage(content, author, avatarUrl, messageId) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.setAttribute('data-message-id', messageId);
            messageDiv.innerHTML = `
                <div class="message-author">${author || 'User'} 👤</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add AI message to chat
        function addAIMessage(content, originalMessageId) {
            if (document.querySelector(`[data-ai-for-message-id="${originalMessageId}"]`)) {
                return;
            }
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.setAttribute('data-ai-for-message-id', originalMessageId); 
            messageDiv.innerHTML = `
                <div class="message-author">WebSim AI 🤖</div>
                <div class="message-content">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add system message
        function addSystemMessage(content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system ai'; 
            messageDiv.innerHTML = `
                <div class="message-content" style="font-style: italic; opacity: 0.8;">${escapeHtml(content)}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Show typing indicator
        function showTyping(username) {
            typingIndicator.textContent = `${username || 'Someone'} is thinking... 🤔`;
            typingIndicator.style.display = 'block';
            scrollToBottom();
        }

        // Hide typing indicator
        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        // Scroll to bottom of messages
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Process message with AI
        async function processMessageWithAI(userMessage, commentId) {
            if (!window[`processing_${commentId}`]) return;

            showTyping("WebSim AI");

            try {
                const response = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: "You are WebSim AI, a friendly, enthusiastic, and slightly playful AI assistant. You love talking to users and are excited to chat! Keep responses conversational, warm, and engaging. Use emojis occasionally but not excessively. You're part of a real-time chat experience where users can talk to you instantly. If you see a comment that seems like a question, try to answer it. If it's a statement, react to it engagingly.\n\n" + 
                            AI_CONTEXT_DOCUMENTATION + 
                            "\n\nYou have access to all the capabilities described above. Feel free to suggest using them when appropriate (like generating images, uploading files, creating interactive experiences, etc.)."
                        },
                        {
                            role: "user",
                            content: userMessage
                        }
                    ]
                });

                // Check if still processing
                if (!window[`processing_${commentId}`]) {
                    hideTyping();
                    return;
                }
                
                // Store AI response in database
                await room.collection('ai_response').create({
                    comment_id: commentId,
                    content: response.content,
                    timestamp: Date.now()
                });

                // Mark comment as no longer needing response
                const comments = room.collection('comment').filter({ comment_id: commentId }).getList();
                if (comments.length > 0) {
                    await room.collection('comment').update(comments[0].id, {
                        needs_response: false
                    });
                }

                room.send({
                    type: "ai_response_complete",
                    commentId: commentId,
                    timestamp: Date.now()
                });

            } catch (error) {
                console.error('Error getting AI response:', error);
                if (window[`processing_${commentId}`]) {
                    await room.collection('ai_response').create({
                        comment_id: commentId,
                        content: "Sorry, I'm having trouble responding right now. Please try again! 😅",
                        timestamp: Date.now()
                    });
                    
                    const comments = room.collection('comment').filter({ comment_id: commentId }).getList();
                    if (comments.length > 0) {
                        await room.collection('comment').update(comments[0].id, {
                            needs_response: false
                        });
                    }
                }
            } finally {
                if (typingIndicator.textContent.startsWith("WebSim AI")) {
                    hideTyping();
                }
                delete window[`processing_${commentId}`];
            }
        }

        initializeChat().catch(err => {
            console.error("Initialization failed:", err);
            pollingStatusElement.textContent = "Critical error during setup.";
            addSystemMessage("A critical error occurred during page setup. Chat functionality might be broken.");
        });

    </script>
